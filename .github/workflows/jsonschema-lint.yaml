name: JSON Schema Lint

on:
  push:
    branches:
      - main
    paths:
      - 'rulesets/schemas/**/*.json'
      - '.github/workflows/jsonschema-lint.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'rulesets/schemas/**/*.json'
      - '.github/workflows/jsonschema-lint.yaml'

jobs:
  lint-jsonschema:
    permissions:
      contents: write # Commit and push schema lint fixes.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
      - name: Install JSON Schema CLI
        run: npm install @sourcemeta/jsonschema@17.2.1
      # Keep the pinned upstream schema unchanged; validate its structure without
      # applying local style rules or automatic rewrites to it.
      - name: Validate OpenLint Schema
        run: npx jsonschema metaschema rulesets/schemas/openlint-v1.schema.json
      - name: Lint JSON Schemas
        run: npx jsonschema lint rulesets/schemas --ignore rulesets/schemas/openlint-v1.schema.json
        continue-on-error: true
      - name: Fix JSON Schema issues
        run: npx jsonschema lint rulesets/schemas --ignore rulesets/schemas/openlint-v1.schema.json --fix
      - name: Commit fixes
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rulesets/schemas/
          if ! git diff --staged --quiet; then
            git commit -m "fix(schema): auto-fix JSON schema linting issues"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
