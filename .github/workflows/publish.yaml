name: Publish

on:
  repository_dispatch:
    types: [publish-event]

jobs:
  release_and_brew:
    name: Release and bump homebrew version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        id: go
        with:
          go-version: '1.27.3'

      - name: Verify release dependency graph resolves without the module proxy
        run: bash ./scripts/verify-direct-dependencies.sh

      - name: Verify tagged module installs directly
        run: |
          set -euo pipefail

          install_dir="$(mktemp -d)"
          install_gopath="$(mktemp -d)"
          install_gocache="$(mktemp -d)"
          trap 'rm -rf "${install_dir}" "${install_gopath}" "${install_gocache}"' EXIT

          cd "${install_dir}"
          go mod init vacuum-install-check
          GOFLAGS=-modcacherw \
            GIT_LFS_SKIP_SMUDGE=1 \
            GOWORK=off \
            GOPROXY=direct \
            GOPATH="${install_gopath}" \
            GOCACHE="${install_gocache}" \
            go get -tool github.com/daveshanley/vacuum@${{ github.event.client_payload.new-tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: html-report/ui/package-lock.json

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  publish_npm:
    name: Publish to NPM
    needs: release_and_brew
    # npm trusted publishing currently requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check version
        run: echo "Version ${{ github.event.client_payload.new-tag }}"

      - name: Use Node.js 26.12.1
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Bump NPM version
        run: npm --no-git-tag-version --allow-same-version version ${{ github.event.client_payload.new-tag }}

      - name: NPM publish
        run: npm publish --access public


  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 50
          fetch-tags: true
          show-progress: true

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            dshanley/vacuum
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: dshanley/vacuum:latest, dshanley/vacuum:${{ github.event.client_payload.new-tag }}, ghcr.io/${{ github.repository }}:latest, ghcr.io/${{ github.repository }}:${{ github.event.client_payload.new-tag }}
          labels: ${{ steps.meta.outputs.labels }}
