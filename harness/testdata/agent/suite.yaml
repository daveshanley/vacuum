version: 1
ruleset: ./rules.yaml
cases:
  - id: valid-operation
    input: ./valid.yaml
    rules: [operation-id-required]
    expect:
      diagnostics: []
      execution:
        operation-id-required:
          status: completed
          matches: {min: 1, max: 1}
          invocations: {min: 1, max: 1}
  - id: missing-operation-id
    input: ./missing-id.yaml
    rules: [operation-id-required]
    expect:
      diagnostics:
        - rule: operation-id-required
          severity: error
          path: $.paths['/pets'].get
      execution:
        operation-id-required:
          status: completed
          invocations: {min: 1}
  - id: verify-repair
    input: ./missing-id.yaml
    after: ./valid.yaml
    rules: [operation-id-required]
    expect:
      diagnostics:
        - rule: operation-id-required
    afterExpect:
      diagnostics: []
      execution:
        operation-id-required:
          status: completed
          invocations: {min: 1}
    change:
      noNew: true
      removed:
        - rule: operation-id-required
